name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The app icon is an Icon Composer document, which needs Xcode 26 or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test core
        run: make test

      - name: Build app
        run: make app

      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Remvel.app Remvel.zip
          shasum -a 256 Remvel.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Remvel-${{ github.sha }}
          path: Remvel.zip
          if-no-files-found: error
