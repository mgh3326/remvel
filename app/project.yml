name: Remvel
options:
  bundleIdPrefix: io.github.remvel
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "0"
targets:
  Remvel:
    type: application
    platform: macOS
    sources:
      - path: Remvel
        excludes:
          - AppIcon.icon
      - path: Remvel/AppIcon.icon
        type: file
        buildPhase: resources
      - Generated/remvel_core.swift
    info:
      path: Remvel/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Remvel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.remvel.Remvel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
        OTHER_LDFLAGS: $(SRCROOT)/../core/target/release/libremvel_core.a
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
